[project]
name = "mirofish-mcp"
version = "0.1.0"
description = "MCP server wrapping the MiroFish swarm-simulation prediction engine"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
